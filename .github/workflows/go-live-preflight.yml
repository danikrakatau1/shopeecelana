name: Go-Live Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check reviewer auth syntax
        run: |
          node --check src/worker-v3-20.js
          node --check dashboard/reviewer-readonly-v1.js
      - name: Run go-live preflight
        run: node scripts/go-live-preflight.mjs
