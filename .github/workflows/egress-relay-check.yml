name: Static Egress Relay Check

on:
  push:
    branches: [main]
    paths:
      - 'egress-relay/**'
      - '.github/workflows/egress-relay-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'egress-relay/**'
      - '.github/workflows/egress-relay-check.yml'

permissions:
  contents: read

jobs:
  relay-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: egress-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Syntax check
        run: node --check server.mjs
      - name: Egress verifier source check
        run: |
          grep -q "url.pathname === '/egress-ip'" server.mjs
          grep -q "https://api.ipify.org?format=json" server.mjs
          grep -q "EGRESS_IP_CACHE_TTL_MS" server.mjs
      - name: Health smoke
        env:
          EGRESS_SHARED_SECRET: ci-only-not-a-production-secret
          STATIC_PROXY_URL: http://user:pass@203.0.113.10:4443
          STATIC_PROXY_PROVIDER: node4
          PORT: '3456'
        run: |
          node server.mjs > /tmp/arstore-egress-relay.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            health="$(curl -fsS http://127.0.0.1:3456/health || true)"
            if printf '%s' "$health" | grep -q '"ok":true' \
              && printf '%s' "$health" | grep -q '"staticEgressValid":true' \
              && printf '%s' "$health" | grep -q '"staticEgressProvider":"node4"' \
              && printf '%s' "$health" | grep -q '"staticEgressEndpointType":"ip"' \
              && printf '%s' "$health" | grep -q '"version":"1.3.0"'; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/arstore-egress-relay.log
          exit 1
